<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorena Vitória • 15 anos & Bodas de Prata</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;background:#fff;color:#102d5f;font-family:Montserrat,Arial,sans-serif}
section{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 7%;text-align:center}
.hero{background:linear-gradient(135deg,#fff,#f5f9ff,#dcecff)}
.flourish{font-size:26px;letter-spacing:8px;color:#174ea6;margin-bottom:20px}
.kicker{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#56729e;font-weight:600}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif}
h1{font-size:clamp(58px,10vw,105px);line-height:.9;margin:22px 0 12px;font-weight:500;color:#0b2f70}
.subtitle{font-family:"Cormorant Garamond",Georgia,serif;font-size:35px}
.names{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin-top:25px}
.names strong{color:#174ea6}
.date{display:inline-block;margin-top:30px;padding:14px 25px;border-top:1px solid #bfc7d1;border-bottom:1px solid #bfc7d1;font-size:14px;letter-spacing:3px}
.message{background:#174ea6;color:white}
.message h2{font-size:65px;font-weight:500;line-height:1;margin:0 0 25px}
.message p{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;line-height:1.45}
.details{background:#f7faff}
.details-wrap{width:100%;max-width:1050px}
.section-title{font-size:56px;margin:0 0 45px;font-weight:500;color:#0b2f70}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border:1px solid #d9e2ef;padding:30px 20px;box-shadow:0 12px 35px rgba(16,45,95,.07)}
.icon{font-size:30px;color:#174ea6}
.card h3{font-size:29px;margin:10px 0}
.card p{margin:5px}
.card .big{font-family:"Cormorant Garamond",Georgia,serif;font-size:29px;color:#174ea6}
.story{background:white}
.story-wrap{max-width:900px}
.story h2{font-size:60px;font-weight:500;margin:0 0 20px}
.story p{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;line-height:1.5}
.highlight{color:#174ea6;border-bottom:1px solid #bfc7d1}
.rsvp{background:linear-gradient(135deg,#0b2f70,#174ea6);color:white}
.rsvp-wrap{width:min(650px,100%)}
.rsvp h2{font-size:58px;font-weight:500;margin:0 0 10px}
.rsvp-intro{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;margin-bottom:25px}
.form{background:white;color:#102d5f;padding:30px;text-align:left}
label{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 7px;font-weight:600}
input,select,textarea{width:100%;padding:13px;border:1px solid #d4dce8;margin-bottom:18px;font:inherit}
textarea{min-height:90px}
button{width:100%;padding:15px;background:#174ea6;color:white;border:0;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.success{display:none;margin-top:18px;padding:15px;background:#eef6ff;color:#0b2f70;text-align:center}
footer{text-align:center;padding:30px;font-size:11px;letter-spacing:2px;color:#6a7890}
@media(max-width:760px){
.cards{grid-template-columns:1fr}
.message h2,.story h2,.rsvp h2{font-size:47px}
.message p,.story p{font-size:23px}
}
</style>
</head>
<body>
